name: PeakCut Cloud Autopilot

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours automatically
  workflow_dispatch:

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install pywebview httpx yt-dlp

      - name: Run Trend Hunter Autopilot Cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEAKCUT_ACCOUNTS: '0'
          PEAKCUT_FETCH_MODEL: '0'
        run: |
          python -c "from studio import autopilot; autopilot._run_cycle()"